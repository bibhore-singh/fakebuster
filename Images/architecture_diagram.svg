<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" rx="16"/>
  <rect x="40" y="40" width="720" height="370" fill="none" stroke="#2a3854" stroke-width="1.5" rx="12"/>
  
  <text x="400" y="80" text-anchor="middle" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="24" font-weight="bold">FAKEBUSTER: System Architecture &amp; Data Pipeline</text>
  <text x="400" y="105" text-anchor="middle" fill="#94a3b8" font-family="'Outfit', sans-serif" font-size="14">Passive Aggressive Classifier (96% Accuracy) &amp; Source Visibility Weighting</text>
  
  <!-- Step 1 -->
  <rect x="70" y="150" width="140" height="80" rx="8" fill="#17223b" stroke="#6366f1" stroke-width="2"/>
  <text x="140" y="185" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">Raw Article Ingestion</text>
  <text x="140" y="205" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="11">Title, Author, Body</text>
  
  <!-- Arrow 1 -->
  <path d="M 210 190 L 250 190" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Step 2 -->
  <rect x="250" y="150" width="140" height="80" rx="8" fill="#17223b" stroke="#06b6d4" stroke-width="2"/>
  <text x="320" y="185" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">TF-IDF Vectorizer</text>
  <text x="320" y="205" text-anchor="middle" fill="#06b6d4" font-family="sans-serif" font-size="11">vector.pkl (N-Grams)</text>
  
  <!-- Arrow 2 -->
  <path d="M 390 190 L 430 190" stroke="#06b6d4" stroke-width="2"/>
  
  <!-- Step 3 -->
  <rect x="430" y="150" width="140" height="80" rx="8" fill="#17223b" stroke="#10b981" stroke-width="2"/>
  <text x="500" y="185" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">PAC Online Model</text>
  <text x="500" y="205" text-anchor="middle" fill="#10b981" font-family="sans-serif" font-size="11">model.pkl (96% Acc)</text>
  
  <!-- Arrow 3 -->
  <path d="M 570 190 L 610 190" stroke="#10b981" stroke-width="2"/>
  
  <!-- Step 4 -->
  <rect x="610" y="150" width="130" height="80" rx="8" fill="#17223b" stroke="#f59e0b" stroke-width="2"/>
  <text x="675" y="185" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="13" font-weight="bold">Authenticity Score</text>
  <text x="675" y="205" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="11">Reliable vs Fake</text>
  
  <!-- Bottom: Source Aggregation & Visibility -->
  <rect x="180" y="280" width="440" height="90" rx="10" fill="#151d30" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="400" y="315" text-anchor="middle" fill="#818cf8" font-family="sans-serif" font-size="14" font-weight="bold">Multi-Article Source Credibility Aggregator</text>
  <text x="400" y="340" text-anchor="middle" fill="#94a3b8" font-family="sans-serif" font-size="12">Computes Social Feed Visibility Multiplier (0.05x to 1.0x)</text>
</svg>
